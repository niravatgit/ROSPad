<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROSpad — Admin</title>
<style>
  :root {
    --bg:     #0d1117; --bg2: #161b22; --bg3: #21262d;
    --border: #30363d; --text: #e6edf3; --text2: #8b949e;
    --accent: #58a6ff; --green: #3fb950; --red: #f85149;
    --yellow: #d29922; --ros: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }

  /* ── Top bar ── */
  #topbar {
    height: 42px; background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 12px;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--ros); }
  .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ros); box-shadow: 0 0 8px var(--ros); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .topbar-title { font-size: 12px; color: var(--text2); }
  .spacer { flex: 1; }
  .topbtn {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); border-radius: 5px; padding: 4px 12px;
    font-size: 12px; cursor: pointer; font-family: inherit;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .topbtn:hover { background: var(--border); }

  /* ── Page layout ── */
  #page { max-width: 760px; margin: 32px auto; padding: 0 20px 60px; }

  h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--text2); margin-bottom: 28px; }

  /* ── Stats row ── */
  #stats { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
  .stat {
    background: var(--bg2); border: 1px solid var(--border);
    padding: 12px 18px; min-width: 120px;
  }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat-lbl { font-size: 10px; color: var(--text2); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }

  /* ── User table ── */
  #user-table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 8px 12px;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text2); border-bottom: 1px solid var(--border);
    background: var(--bg2);
  }
  td { padding: 10px 12px; border-bottom: 1px solid var(--bg3); vertical-align: middle; }
  tr:hover td { background: var(--bg2); }
  tr.is-admin td:first-child { color: var(--yellow); }

  .badge {
    font-size: 10px; padding: 2px 7px; border-radius: 3px;
    border: 1px solid; letter-spacing: 0.06em;
  }
  .badge.admin   { color: var(--yellow); border-color: var(--yellow); }
  .badge.teacher { color: var(--accent); border-color: var(--accent); }
  .badge.ok      { color: var(--green);  border-color: var(--green);  }

  /* ── Inline reset form ── */
  .reset-row td { background: var(--bg3) !important; }
  .reset-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .reset-form input {
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--text); padding: 5px 9px; font-family: inherit;
    font-size: 12px; outline: none; width: 200px;
    border-radius: 4px;
  }
  .reset-form input:focus { border-color: var(--accent); }
  .btn { border: 1px solid; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: inherit; background: none; border-radius: 4px; }
  .btn-green { color: var(--green); border-color: var(--green); }
  .btn-green:hover { background: rgba(63,185,80,0.1); }
  .btn-red   { color: var(--red);   border-color: var(--red); }
  .btn-red:hover { background: rgba(248,81,73,0.1); }
  .btn-dim   { color: var(--text2); border-color: var(--border); }
  .btn-dim:hover { background: var(--border); color: var(--text); }
  .msg { font-size: 11px; padding: 4px 0; }
  .msg.ok  { color: var(--green); }
  .msg.err { color: var(--red); }

  /* ── Register teacher panel ── */
  #reg-teacher { background: var(--bg2); border: 1px solid var(--border); padding: 18px 20px; margin-bottom: 28px; }
  #reg-teacher h2 { font-size: 14px; margin-bottom: 10px; color: var(--accent); }
  .reg-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .reg-form input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 5px 9px; font-family: inherit; font-size: 12px; outline: none; width: 160px; border-radius: 4px; }
  .reg-form input:focus { border-color: var(--accent); }

  /* ── Access denied ── */
  #denied { display: none; text-align: center; padding: 80px 20px; }
  #denied h2 { color: var(--red); margin-bottom: 8px; }
  #denied p  { color: var(--text2); font-size: 13px; }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo"><div class="logo-dot"></div>ROSpad</div>
  <span class="topbar-title">/ Admin</span>
  <div class="spacer"></div>
  <span id="topbar-user" style="font-size:12px;color:var(--text2);margin-right:8px"></span>
  <a class="topbtn" href="/">← IDE</a>
  <button class="topbtn" onclick="logout()" style="margin-left:6px">Logout</button>
</div>

<div id="page" style="display:none">
  <h1>User Management</h1>
  <p class="sub">Reset passwords or remove student accounts. Workspaces are kept on disk even after deletion.</p>

  <div id="stats">
    <div class="stat"><div class="stat-num" id="stat-total">—</div><div class="stat-lbl">Total users</div></div>
    <div class="stat"><div class="stat-num" id="stat-teachers">—</div><div class="stat-lbl">Teachers</div></div>
    <div class="stat"><div class="stat-num" id="stat-students">—</div><div class="stat-lbl">Students</div></div>
  </div>

  <div id="reg-teacher">
    <h2>Register Teacher Account</h2>
    <div class="reg-form">
      <input type="text" id="reg-username" placeholder="username" autocomplete="off"/>
      <input type="text" id="reg-password" placeholder="password"/>
      <button class="btn btn-green" onclick="registerTeacher()">Create Teacher</button>
      <span class="msg" id="reg-msg"></span>
    </div>
  </div>

  <div id="user-table-wrap">
    <table id="user-table">
      <thead>
        <tr>
          <th>Username</th>
          <th>Role</th>
          <th>Workspace</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="user-tbody"></tbody>
    </table>
  </div>
</div>

<div id="denied">
  <h2>Access Denied</h2>
  <p>This page is for the admin account only.</p>
  <p style="margin-top:12px"><a href="/" style="color:var(--accent)">← Back to IDE</a></p>
</div>

<script>
let _users = [], _myRole = '';

async function init() {
  const r = await fetch('/api/me').then(r => r.json()).catch(() => ({}));
  if (!r.username) { location.href = '/'; return; }
  if (r.role !== 'admin') {
    document.getElementById('denied').style.display = 'block';
    return;
  }
  _myRole = r.role;
  document.getElementById('topbar-user').textContent = '@' + r.username;
  document.getElementById('page').style.display = 'block';
  loadUsers();
}

async function loadUsers() {
  const data = await fetch('/api/admin/users').then(r => r.json());
  _users = data;
  document.getElementById('stat-total').textContent    = data.length;
  document.getElementById('stat-teachers').textContent = data.filter(u => u.role === 'teacher').length;
  document.getElementById('stat-students').textContent = data.filter(u => u.role === 'student').length;
  renderTable(data);
}

const ROLE_BADGE = {
  admin:   '<span class="badge admin">admin</span>',
  teacher: '<span class="badge teacher">teacher</span>',
  student: '<span style="color:var(--text2);font-size:12px">student</span>',
};

function renderTable(users) {
  const tbody = document.getElementById('user-tbody');
  tbody.innerHTML = '';
  users.forEach(u => {
    const isAdmin   = u.role === 'admin';
    const isTeacher = u.role === 'teacher';
    const tr = document.createElement('tr');
    if (isAdmin) tr.classList.add('is-admin');
    tr.id = 'row-' + u.username;

    // Role toggle button (admin only)
    let roleToggle = '';
    if (_myRole === 'admin' && !isAdmin) {
      if (isTeacher) {
        roleToggle = `<button class="btn btn-dim" style="margin-left:6px;font-size:11px" onclick="setRole('${esc(u.username)}','student')">→ Student</button>`;
      } else {
        roleToggle = `<button class="btn btn-dim" style="margin-left:6px;font-size:11px" onclick="setRole('${esc(u.username)}','teacher')">→ Teacher</button>`;
      }
    }

    // Action buttons
    let actions = '<span style="color:var(--text2);font-size:11px">—</span>';
    if (!isAdmin) {
      actions = `
        <button class="btn btn-dim" onclick="showReset('${esc(u.username)}')">Reset Password</button>
        ${roleToggle}
        <button class="btn btn-red" style="margin-left:6px" onclick="deleteUser('${esc(u.username)}')">Delete</button>
      `;
    }

    tr.innerHTML = `
      <td>${esc(u.username)}</td>
      <td>${ROLE_BADGE[u.role] || u.role}</td>
      <td>${u.hasWorkspace ? '<span class="badge ok">✓ exists</span>' : '<span style="color:var(--text2)">—</span>'}</td>
      <td>${actions}</td>`;
    tbody.appendChild(tr);
  });
}

function showReset(username) {
  document.querySelectorAll('.reset-row').forEach(r => r.remove());
  const anchor = document.getElementById('row-' + username);
  const tr = document.createElement('tr');
  tr.className = 'reset-row';
  tr.id = 'reset-' + username;
  tr.innerHTML = `
    <td colspan="4">
      <div class="reset-form">
        <span style="font-size:12px;color:var(--text2)">New password for <strong style="color:var(--text)">${esc(username)}</strong>:</span>
        <input type="text" id="pw-${username}" placeholder="new password" />
        <button class="btn btn-green" onclick="doReset('${esc(username)}')">Set Password</button>
        <button class="btn btn-dim" onclick="document.getElementById('reset-${username}').remove()">Cancel</button>
        <span class="msg" id="msg-${username}"></span>
      </div>
    </td>`;
  anchor.after(tr);
  document.getElementById('pw-' + username).focus();
  document.getElementById('pw-' + username).addEventListener('keydown', e => {
    if (e.key === 'Enter') doReset(username);
  });
}

async function doReset(username) {
  const pw  = document.getElementById('pw-' + username).value.trim();
  const msg = document.getElementById('msg-' + username);
  if (!pw) { msg.textContent = 'Enter a password.'; msg.className = 'msg err'; return; }
  const r = await fetch('/api/admin/reset-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, newPassword: pw })
  }).then(r => r.json());
  if (r.ok) {
    msg.textContent = '✓ Password updated.'; msg.className = 'msg ok';
    setTimeout(() => document.getElementById('reset-' + username)?.remove(), 1800);
  } else { msg.textContent = r.error || 'Error.'; msg.className = 'msg err'; }
}

async function setRole(username, role) {
  const r = await fetch('/api/admin/set-role', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, role })
  }).then(r => r.json());
  if (r.ok) loadUsers();
  else alert(r.error || 'Role change failed.');
}

async function registerTeacher() {
  const username = document.getElementById('reg-username').value.trim();
  const password = document.getElementById('reg-password').value.trim();
  const msg      = document.getElementById('reg-msg');
  if (!username || !password) { msg.textContent = 'Fill in both fields.'; msg.className = 'msg err'; return; }
  const r = await fetch('/api/admin/register-teacher', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  }).then(r => r.json());
  if (r.ok) {
    msg.textContent = `✓ Teacher @${username} created.`; msg.className = 'msg ok';
    document.getElementById('reg-username').value = '';
    document.getElementById('reg-password').value = '';
    loadUsers();
    setTimeout(() => msg.textContent = '', 3000);
  } else { msg.textContent = r.error || 'Error.'; msg.className = 'msg err'; }
}

async function deleteUser(username) {
  if (!confirm(`Delete user "${username}"?\n\nTheir workspace files will be kept on disk.`)) return;
  const r = await fetch(`/api/admin/user/${encodeURIComponent(username)}`, { method: 'DELETE' })
    .then(r => r.json());
  if (r.ok) loadUsers();
  else alert(r.error || 'Delete failed.');
}

function logout() {
  fetch('/api/logout', { method: 'POST' }).finally(() => location.href = '/');
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
